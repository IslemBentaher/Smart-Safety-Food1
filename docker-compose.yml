# Optional: app + MongoDB together.   docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      STORAGE: mongo
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
